server:
  port: 8084
  servlet:
    application-display-name: jwt-demo-service

#JWT Configuration
jwt:
  # Base64-encoded HMAC key, must be >= 256 bits. In production inject via env var / secret manager.
  secret: ${JWT_SECRET:pU+WZqWgp4+vmBtuLyu/nTPn5e3bJruE5pMg6pI71ZxDTTli7jPfAoMFuEVfOHCZ}
  issuer: jwt-demo
  access-token-expiration-ms: 900000   # 15 minutes
  refresh-token-expiration-ms: 604800000   # 7 days

#Redis Configuration
spring:
  data:
    redis:
      host: localhost          # change if Redis is remote
      port: 6379
      password:                # leave empty if no password
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

#Log Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n"
  level:
    com.example.jwtdemo: DEBUG


# Rate Limiting
rate-limit:
  enabled: true
  max-requests: 10          # max requests
  window-seconds: 60        # per this many seconds

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      externalService:                    # name you will use in @CircuitBreaker
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50          # open circuit if 50% of calls fail
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s     # calls slower than 2s are considered slow

  retry:
    instances:
      externalService:
        maxAttempts: 10
        waitDuration: 4000ms               # base wait
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2   # 500ms → 1s → 2s
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions: